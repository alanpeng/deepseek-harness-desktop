# Pin the MSVC linker explicitly: under Git Bash, the GNU `link` from
# /usr/bin shadows MSVC's link.exe on PATH and rustc's build-script linking
# would invoke the wrong tool. cargo check only compiles, so the failure
# only shows up when a build script or the final binary links.
[target.x86_64-pc-windows-msvc]
linker = "C:/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools/VC/Tools/MSVC/14.44.35207/bin/Hostx64/x64/link.exe"

# vcvars environment: link.exe resolves kernel32.lib & friends via LIB.
# Each Bash tool call is a fresh shell (no persistent `export`), so pin the
# MSVC + Windows SDK lib/include search paths here instead; cargo injects
# [env] vars into rustc and every build script. Version paths must match
# the installed MSVC (14.44.35207) and Windows SDK (10.0.26100.0).
[env]
CC = "C:/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools/VC/Tools/MSVC/14.44.35207/bin/Hostx64/x64/cl.exe"
CXX = "C:/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools/VC/Tools/MSVC/14.44.35207/bin/Hostx64/x64/cl.exe"
AR = "C:/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools/VC/Tools/MSVC/14.44.35207/bin/Hostx64/x64/lib.exe"
LIB = "C:/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools/VC/Tools/MSVC/14.44.35207/lib/x64;C:/Program Files (x86)/Windows Kits/10/Lib/10.0.26100.0/ucrt/x64;C:/Program Files (x86)/Windows Kits/10/Lib/10.0.26100.0/um/x64"
INCLUDE = "C:/Program Files (x86)/Microsoft Visual Studio/2022/BuildTools/VC/Tools/MSVC/14.44.35207/include;C:/Program Files (x86)/Windows Kits/10/Include/10.0.26100.0/ucrt;C:/Program Files (x86)/Windows Kits/10/Include/10.0.26100.0/um;C:/Program Files (x86)/Windows Kits/10/Include/10.0.26100.0/shared"
