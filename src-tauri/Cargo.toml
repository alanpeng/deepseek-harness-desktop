[package]
name = "dsh-desktop"
version = "0.1.0"
description = "Desktop shell for DeepSeek Harness (dsh) — Tauri 2 + Node sidecar"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-shell = "2.3"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-dialog = "2.7.2"
# Same reqwest/rustls pairing the updater plugin compiles: rustls 0.23 with
# ring only (aws-lc-rs needs cmake; avoided deliberately).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
minisign-verify = "0.2"
# Same version tauri-plugin-updater compiles (0.22) — used to decode the
# tauri-signer public key format the same way the shell updater does.
base64 = "0.22"
sha2 = "0.10"
semver = "1"
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt", "sync"] }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
winreg = "0.52"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
