# 三平台发布：push tag v*（或 workflow_dispatch 手动触发）后，
# 4 个并行 build job（Windows NSIS / macOS x64 / macOS arm64 / Linux）各自
# 构建 sidecar runtime + shell bundle，上传到 release v<version>；
# finalize job 合并各平台 latest.json 片段并上传最终 latest.json。
#
# 需要的 secrets（repo Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY          D:\secrets\dsh-updater.key 的完整内容
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 对应密码
#   GH_PAT                             带 repo 权限的 PAT（跨仓库上传 runtime）
#
# macOS 未签名（无 Apple 证书）：Gatekeeper 下需要右键打开。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.1）；push tag 触发时自动取 tag 名'
        required: false
      notes:
        description: '发布说明（Release body）'
        required: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
    steps:
      - id: out
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$V" ]; then
            echo "::error::需要 version：workflow_dispatch 输入，或 push v* tag"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  # 先建 release，build jobs 用 --release-tag 复用，避免 4 个 job 并发 POST
  # 撞同一个 tag。重复运行时 422 属正常（build 会复用现有 release）。
  create-release:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Create release v${{ needs.version.outputs.version }}
        run: |
          V="${{ needs.version.outputs.version }}"
          BODY="${{ github.event.inputs.notes }}"
          [ -z "$BODY" ] && BODY="dsh-desktop $V"
          JSON="$(jq -n --arg t "v$V" --arg n "$BODY" '{tag_name:$t,name:$t,body:$n}')"
          curl -fsS -X POST "https://api.github.com/repos/${{ github.repository }}/releases" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -d "$JSON" -o /dev/null \
            || echo "::warning::release v$V 已存在或创建失败（build 将复用现有 release）"

  build:
    needs: [version, create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2026-08: GitHub 标准 macOS runner 已全部 Apple Silicon（macos-15
          # 实测也是 arm64），无免费 Intel runner —— macos-x86_64 暂不发布。
          # arch sanity 步骤兜底平台后缀与 runner 不匹配的情况。
          - { os: windows-latest, platform: windows-x86_64, bundles: nsis }
          - { os: macos-latest, platform: macos-aarch64, bundles: app,dmg }
          # ubuntu-24.04 (not 22.04): the current tauri chain (wry 0.55.1
          # pins webkit2gtk =2.0.2, whose sys crate dropped webkit2gtk-4.0
          # support) requires webkit2gtk-4.1 — jammy ships 4.0 only, so 22.04
          # cannot build at all. noble has libwebkit2gtk-4.1-dev; its missing
          # libfuse2 (dropped in 24.04) is supplied by libfuse2t64 for
          # linuxdeploy, and APPIMAGE_EXTRACT_AND_RUN=1 skips FUSE mounting.
          # glibc 2.39 artifacts are not guaranteed on RHEL 9 (glibc 2.34);
          # deterministic RHEL 9 support would need a self-hosted AlmaLinux 9
          # runner (glibc 2.34 + webkit2gtk4.1-devel, same constraints).
          - { os: ubuntu-24.04, platform: linux-x86_64, bundles: deb,appimage }
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # linuxdeploy is itself an AppImage; ubuntu-24.04 runners ship no
      # libfuse2, so run it via extract-and-run instead of FUSE mounting.
      # Harmless on the other platforms.
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # npm 全局装而不是 corepack：Windows 上 build-sidecar 从
      # %APPDATA%\npm\node_modules\pnpm\bin\pnpm.mjs 解析 pnpm（.cmd shim
      # 在 execFileSync 下不可靠），npm -g 与本地布局一致。
      - name: Install pnpm
        run: npm install -g pnpm@11

      # workspace root devDeps：release-desktop.mjs spawn
      # node_modules/@tauri-apps/cli/tauri.js 做 tauri build —— 不装必炸。
      # Windows 上 npm -g 的安装位置随 runner 布局（%APPDATA%\npm 或
      # hostedtoolcache node 目录旁），用 command -v 动态解析 pnpm.mjs。
      - name: Install workspace deps
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            node "$(dirname "$(command -v pnpm)")/node_modules/pnpm/bin/pnpm.mjs" install --frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi

      # matrix.os 是 ubuntu-24.04，这里曾误写 'ubuntu-latest' 导致该步骤
      # 永远跳过 —— 整个 Linux 构建没有任何 GTK 依赖，gdk-sys 直接炸。
      # libfuse2t64: 24.04 把 libfuse2 换成了 t64 重构建，linuxdeploy 的
      # AppImage 需要 libfuse.so.2（配合 APPIMAGE_EXTRACT_AND_RUN=1 双保险）。
      - name: Install Linux build deps
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libxdo-dev libfuse2t64
          # 提前暴露缺包问题，别等 rust 编译到一半才报 pkg-config
          pkg-config --exists gtk+-3.0 gdk-3.0 || {
            echo "::error::GTK dev 包未就绪: $(pkg-config --modversion gtk+-3.0 2>&1)"
            exit 1
          }

      - name: Sanity runner arch
        shell: bash
        run: |
          arch="$(uname -m)"
          echo "runner arch: $arch (target ${{ matrix.platform }})"
          case "${{ matrix.platform }}" in
            *x86_64)  test "$arch" = "x86_64" || { echo "::error::runner 架构与平台不匹配"; exit 1; } ;;
            *aarch64) test "$arch" = "arm64"  || { echo "::error::runner 架构与平台不匹配"; exit 1; } ;;
          esac

      # tauri 在 linuxdeploy 失败时只报一句 'failed to run linuxdeploy'
      # （stderr 被吞），预检提前暴露 FUSE/提取问题；同时把 linuxdeploy
      # AppImage 预下载进 tauri 的缓存目录，正式打包直接复用。
      - name: Probe linuxdeploy
        if: matrix.platform == 'linux-x86_64'
        run: |
          curl -fsSL -o /tmp/linuxdeploy.AppImage \
            https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/linuxdeploy.AppImage --version
          mkdir -p "$HOME/.cache/tauri"
          cp /tmp/linuxdeploy.AppImage "$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage"

      # sidecar runtime + shell bundle + 上传（release 由 create-release 建好）
      - name: Build shell bundle and upload
        shell: bash
        run: |
          node scripts/release-desktop.mjs \
            --version "${{ needs.version.outputs.version }}" \
            --platform "${{ matrix.platform }}" \
            --fragment \
            --release-tag "v${{ needs.version.outputs.version }}" \
            --node-from-exec \
            --notes "${{ github.event.inputs.notes }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # runtime 工件跨仓库上传（deepseek-harness-runtime），用 GH_PAT。
      # --skip-build 复用上一步已打包的 dist tar.gz，但保留完整发布路径：
      # 签名（TAURI_SIGNING_PRIVATE_KEY secret）+ 幂等创建/复用 release +
      # 上传 3 个工件。不能用 --upload-only —— 它要求 release 已存在且
      # 跳过签名（.minisig 不会生成），首次发布必然失败。
      - name: Release runtime artifact
        shell: bash
        run: |
          node scripts/release-runtime.mjs \
            --platform "${{ matrix.platform }}" \
            --skip-build
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Upload latest.json fragment
        uses: actions/upload-artifact@v5
        with:
          name: latest-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/latest-${{ matrix.platform }}.json
          if-no-files-found: error

  finalize:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download fragments
        uses: actions/download-artifact@v5
        with:
          pattern: 'latest-*'
          merge-multiple: true
          path: fragments

      - name: Merge and upload latest.json
        run: |
          node scripts/merge-latest.mjs \
            --dir fragments \
            --version "${{ needs.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
