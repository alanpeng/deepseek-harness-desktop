# 自动跟进官方 @deepseek-ai/dsh 正式版：cron 每天检查 npm，
# 只认无 pre-release 段的正式版（x.y.z —— dev/rc/beta 全部忽略），
# 有新正式版 → bump runtime-manifest + 更新 lockfile → 提交 →
# 三平台构建 runtime 资产发布到 deepseek-harness-runtime。
# 客户端侧已有启动检查，会自动热更新到新 runtime。
#
# 需要的 secrets 与 release.yml 相同：
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD / GH_PAT
#
# 手动运行：Actions → auto-update-dsh → Run workflow。

name: auto-update-dsh

on:
  schedule:
    # 每小时第 37 分（避开整点 cron 潮）；仓库 public，Actions 免费不限量
    - cron: '37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@11

      # 接受正式版（x.y.z）和 RC（x.y.z-rc.N），dev/alpha/beta 一律忽略；
      # semver 顺序：正式版 > 同 base 的 rc（rc 永不盖过正式版）。
      - name: Check npm for acceptable dsh release
        id: bump
        shell: bash
        run: |
          LATEST="$(npm view @deepseek-ai/dsh versions --json | node -e '
            const vs = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const ok = vs.filter((v) => /^\d+\.\d+\.\d+(-rc\.\d+)?$/.test(v))
            const parse = (v) => {
              const m = /^(\d+)\.(\d+)\.(\d+)(?:-rc\.(\d+))?$/.exec(v)
              return [Number(m[1]), Number(m[2]), Number(m[3]), m[4] ? Number(m[4]) : Infinity]
            }
            const cmp = (a, b) => {
              const x = parse(a), y = parse(b)
              for (let i = 0; i < 4; i++) if (x[i] !== y[i]) return x[i] - y[i]
              return 0
            }
            ok.sort(cmp)
            process.stdout.write(ok[ok.length - 1] || "")
          ')"
          echo "latest acceptable dsh: ${LATEST:-（无正式版/rc）}"
          if [ -z "$LATEST" ]; then
            echo "没有可接受的版本发布，无事可做"
            exit 0
          fi
          CUR="$(node -p "require('./sidecar/runtime-manifest/package.json').dependencies['@deepseek-ai/dsh']")"
          if [ "$LATEST" = "$CUR" ]; then
            echo "已是 $LATEST，无需更新"
            exit 0
          fi
          echo "发现新版 $LATEST（当前 $CUR），开始 bump…"
          # bump dsh 及全部 @deepseek-ai/* 子包到各自最高可接受版本。
          # 官方按 workspace 同步发版（dsh 0.1.0-rc.6 时子包同发 0.1.0-rc.6）；
          # 只升 dsh 会把闭包变成"新 dsh + 旧插件"混装 —— v0.1.1 事故根源：
          # dsh-subprocess-local@0.1.0-rc.6 需要 SubprocessRuntime 导出，
          # 而 dsh-subprocess 停在 0.0.1-rc.1（npm latest tag 误导）没有该导出。
          # 过滤规则与上方一致：只接受 x.y.z / x.y.z-rc.N，dev/alpha/beta 忽略。
          node -e '
            const fs = require("fs")
            const p = "sidecar/runtime-manifest/package.json"
            const j = JSON.parse(fs.readFileSync(p, "utf8"))
            j.dependencies["@deepseek-ai/dsh"] = "'"$LATEST"'"
            const parse = (v) => { const m = /^(\d+)\.(\d+)\.(\d+)(?:-(rc)\.(\d+))?$/.exec(v); return m ? [Number(m[1]), Number(m[2]), Number(m[3]), m[4] === "rc" ? Number(m[5]) : Infinity] : null }
            const cmp = (a, b) => { const x = parse(a), y = parse(b); if (!x || !y) return 0; for (let i = 0; i < 4; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0 }
            ;(async () => {
              const names = Object.keys(j.dependencies).filter((k) => k.startsWith("@deepseek-ai/"))
              for (const n of names) {
                if (n === "@deepseek-ai/dsh") continue
                const doc = await (await fetch(`https://registry.npmjs.org/${n.replace("/", "%2F")}`)).json()
                const ok = Object.keys(doc.versions).filter((v) => parse(v))
                ok.sort(cmp)
                const best = ok[ok.length - 1]
                if (best && best !== j.dependencies[n]) {
                  console.log(`  ${n}: ${j.dependencies[n]} -> ${best}`)
                  j.dependencies[n] = best
                }
              }
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n")
            })()
          '
          # 更新 lockfile（--lockfile-only：只解析树，不装 node_modules）。
          # 直接调 PATH 里的 pnpm：`$(dirname $(command -v pnpm))/node_modules/...`
          # 是 Windows 专属绕法（npm -g 布局差异），在 Linux runner 上
          # command -v pnpm 是 symlink，拼出的路径不存在，node 直接 ENOENT
          # （rc.7 是首次真正走到这行，之前全是"无新版本"提前 exit 0）。
          cd sidecar/runtime-manifest
          # --config.minimum-release-age=0: pnpm 11 默认 24h 供应链截断，
          # 会把刚发布的官方 rc 判为"太新"直接拒绝（ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION）
          pnpm install --lockfile-only --config.confirmModulesPurge=false --config.minimum-release-age=0
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidecar/runtime-manifest/package.json sidecar/runtime-manifest/pnpm-lock.yaml
          git commit -m "chore(runtime): bump @deepseek-ai/dsh to $LATEST"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # 三平台并行发布 runtime 资产（与 release.yml 的 runtime 步骤同逻辑，
  # 只跑 runtime：不编译 shell，不需要 rust 工具链和 Linux GTK 依赖）
  runtime:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows-x86_64 }
          - { os: macos-latest, platform: macos-aarch64 }
          - { os: ubuntu-24.04, platform: linux-x86_64 }
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # 与 release.yml 相同：Windows 上 npm -g 的 pnpm 布局随 runner
      # 变化，用 command -v 动态解析（.cmd shim 在 execFileSync 下不可靠）
      - name: Install pnpm
        run: npm install -g pnpm@11

      # --config.minimum-release-age=0：根 workspace 的 install 解析 bump 后
      # 的 rc 包，pnpm 11 默认 24h 供应链截断会拒绝刚发布的官方 rc
      - name: Install workspace deps
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            node "$(dirname "$(command -v pnpm)")/node_modules/pnpm/bin/pnpm.mjs" install --frozen-lockfile --config.minimum-release-age=0
          else
            pnpm install --frozen-lockfile --config.minimum-release-age=0
          fi

      # build-sidecar（含 koffi musl 修剪）+ signer 签名 + 上传。
      # 发布是幂等的：重跑同版本会删旧资产重传、复用已有 release。
      - name: Release runtime artifact
        shell: bash
        run: |
          node scripts/release-runtime.mjs \
            --platform "${{ matrix.platform }}" \
            --node-from-exec
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
