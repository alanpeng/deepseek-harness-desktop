<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0d1117; color: #e6edf3;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .card { text-align: center; max-width: 480px; padding: 24px; }
    .logo {
      font-size: 42px; font-weight: 700; letter-spacing: 1px;
      background: linear-gradient(135deg, #4d7cfe, #a855f7);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .spinner {
      width: 28px; height: 28px; margin: 24px auto;
      border: 3px solid #30363d; border-top-color: #4d7cfe;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { color: #8b949e; font-size: 14px; }
    .error { color: #f85149; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
    .hint { color: #6e7681; font-size: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">dsh</div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">正在启动 DeepSeek Harness…</div>
    <div class="error" id="error" hidden></div>
    <div class="hint" id="hint" hidden>如果长时间没有反应，请从托盘菜单「重启 Host」。</div>
  </div>
  <script>
    // The shell navigates here with ?error=<message> when the host fails to start.
    const params = new URLSearchParams(location.search);
    const err = params.get('error');
    if (err) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').textContent = '启动失败';
      document.getElementById('error').textContent = decodeURIComponent(err);
      document.getElementById('error').hidden = false;
      document.getElementById('hint').hidden = false;
    }
  </script>
</body>
</html>
